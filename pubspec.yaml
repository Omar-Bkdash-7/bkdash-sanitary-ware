name: bkdash_sanitary_ware
description: بكداش - نظام إدارة المخزون والفواتير لشركة بكداش لتجارة الأدوات الصحية ومستلزمات المياه.
publish_to: 'none'
version: 1.0.0+1

environment:
  # Flutter 3.47.x ships Dart 3.13.x. local_auth 3.x requires Dart ^3.10.
  sdk: ^3.10.0
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management (MVVM: ChangeNotifier + Provider)
  provider: ^6.1.5+1

  # Local storage
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3

  # Security
  local_auth: ^3.0.2
  crypto: ^3.0.6

  # Backup / export
  share_plus: ^13.3.1
  file_selector: ^1.1.0

  # Reports
  fl_chart: ^1.3.0
  flutter_secure_storage: ^11.2.0
  pdf: ^3.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true
  
  assets:
    - assets/images/bkdash_icon.png
    # Arabic invoice PDF (Amiri, SIL OFL - see assets/fonts/Amiri-OFL.txt).
    - assets/fonts/Amiri-Regular.ttf
    - assets/fonts/Amiri-Bold.ttf

# App Icon Configuration
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/bkdash_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/images/bkdash_icon.png"
